<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Rekod Nikah</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; }
        .container { max-width: 600px; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin: auto; }
        h2 { color: #007bff; text-align: center; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background-color: #28a745; color: white; padding: 12px; border: none; width: 100%; border-radius: 4px; font-size: 16px; cursor: pointer; }
        button:hover { background-color: #218838; }
    </style>
</head>
<body>

<div class="container">
    <h2>Sistem Pengurusan Rekod Nikah</h2>
    <form id="nikahForm">
        <div class="form-group">
            <label>Nama Suami:</label>
            <input type="text" id="namaSuami" required placeholder="Masukkan nama penuh suami">
        </div>
        <div class="form-group">
            <label>Nama Isteri:</label>
            <input type="text" id="namaIsteri" required placeholder="Masukkan nama penuh isteri">
        </div>
        <div class="form-group">
            <label>Tarikh Nikah:</label>
            <input type="date" id="tarikhNikah" required>
        </div>
        <div class="form-group">
            <label>No. Sijil / Rujukan:</label>
            <input type="text" id="noSijil" required placeholder="Contoh: NK-2026-001">
        </div>
        <button type="submit">Simpan Rekod</button>
    </form>
</div>

<script>
    document.getElementById('nikahForm').addEventListener('submit', function(e) {
        e.preventDefault();
        alert('Data berjaya direkodkan! (Sistem siap untuk diintegrasikan dengan Firebase)');
    });
</script>

</body>
</html>
